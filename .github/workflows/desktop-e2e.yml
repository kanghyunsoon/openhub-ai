name: Desktop E2E (Linux)

# 실제 Electron E2E를 Linux runner(xvfb)에서 실행한다. v0.2.0 merge gate: required check 이름은 "desktop-e2e"(맨 아래 job)다.
# - 모든 PR과 main push에서 결론을 낸다(paths 필터 없음). 그래서 Desktop과 무관한 PR에서도 required check가 비지 않는다.
# - 변경 판단은 scripts/desktop-e2e.mjs(changes)가 한다. 영향이 없다고 확인된 경로(문서, 다른 워크플로, 패키지 테스트 파일, CLI,
#   저장소 테스트)만 있으면 "E2E 불필요"(성공)이고, 그 밖의 변경·모르는 변경·diff 실패는 모두 Electron E2E를 실행한다.
# - 실행 대상은 파일마다 한 단계(순서대로)다. 마지막 검사(check)가 apps/desktop/test에서 OPENHUB_E2E로 켜지는 파일을 모두 찾아,
#   워크플로에 등록되지 않아 실행되지 않은 파일·결과 누락·건너뜀·todo·0개 실행이 있으면 실패한다.
# - 단위 테스트는 CI(check)가 맡는다. 이 워크플로는 실제 Electron 창 테스트만 돌린다(continue-on-error 없음).
# - 테스트는 임시 project·home, 가짜 npm·Health만 쓴다(실제 MCP 실행·secret 없음). 실제 MCP 검증은 registry-remote.yml(sandbox)에 따로 있다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: desktop-e2e / detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: Electron E2E runs"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then range="$BASE...$HEAD"; else range="$BEFORE..$HEAD"; fi
          if ! git diff --name-only "$range" > "$RUNNER_TEMP/changed.txt"; then
            echo "could not compute changed files for $range: Electron E2E runs"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! decision=$(node scripts/desktop-e2e.mjs changes "$RUNNER_TEMP/changed.txt"); then
            echo "change classification failed: Electron E2E runs"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$decision"
          echo "$decision" >> "$GITHUB_OUTPUT"

  electron:
    name: desktop-e2e / electron
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENHUB_E2E: "1"
      # GitHub runner에서는 Chromium SUID sandbox helper를 설정할 수 없어 이 job(테스트 전용)에서만 Electron sandbox를 끈다.
      # 배포물·사용자 실행에는 영향이 없다(main.ts는 sandbox: true로 창을 만든다).
      ELECTRON_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Electron 실행 의존성(xvfb·GTK·NSS)
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 libnotify4 libsecret-1-0
      - id: install
        run: pnpm install --frozen-lockfile
      # 파일마다 한 단계씩 순서대로 실행한다(각 파일이 beforeAll에서 같은 출력 폴더로 데스크톱을 빌드한다).
      # 앞 파일이 실패해도 나머지 파일은 실행해 결과를 남기고, 하나라도 실패하면 job이 실패한다.
      - name: E2E i18n
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: xvfb-run -a pnpm exec vitest run apps/desktop/test/i18n-electron.e2e.test.ts --reporter=verbose --reporter=json --outputFile.json=e2e-results/i18n.json
      - name: E2E repair
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: xvfb-run -a pnpm exec vitest run apps/desktop/test/repair-electron.e2e.test.ts --reporter=verbose --reporter=json --outputFile.json=e2e-results/repair.json
      - name: E2E install clients
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: xvfb-run -a pnpm exec vitest run apps/desktop/test/install-clients-electron.e2e.test.ts --reporter=verbose --reporter=json --outputFile.json=e2e-results/install-clients.json
      - name: E2E user scope
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: xvfb-run -a pnpm exec vitest run apps/desktop/test/user-scope-electron.e2e.test.ts --reporter=verbose --reporter=json --outputFile.json=e2e-results/user-scope.json
      - name: E2E for you (diagnostics, add to another client or scope)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: xvfb-run -a pnpm exec vitest run apps/desktop/test/for-you-electron.e2e.test.ts --reporter=verbose --reporter=json --outputFile.json=e2e-results/for-you.json
      - name: E2E npx lifecycle smoke (install, update, rollback, Health in the window)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: xvfb-run -a pnpm exec vitest run apps/desktop/test/npx-lifecycle-smoke.test.ts --reporter=verbose --reporter=json --outputFile.json=e2e-results/npx-lifecycle-smoke.json
      # 건너뛴 테스트를 통과로 보지 않고, 등록되지 않은 Electron E2E 파일이 있으면 실패한다.
      - name: Every Electron E2E file ran (none missing, none skipped)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/desktop-e2e.mjs check e2e-results

  desktop-e2e:
    name: desktop-e2e
    needs: [changes, electron]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          ELECTRON: ${{ needs.electron.result }}
        run: |
          echo "changes=$CHANGES run=$RUN electron=$ELECTRON"
          if [ "$CHANGES" != "success" ]; then
            echo "change detection did not succeed"
            exit 1
          fi
          if [ "$RUN" = "true" ]; then
            if [ "$ELECTRON" != "success" ]; then
              echo "Electron E2E did not succeed ($ELECTRON)"
              exit 1
            fi
            echo "Electron E2E passed"
          else
            echo "No Desktop, Core, Registry, dependency or workflow change: Electron E2E not needed"
          fi

