name: RC packaged app (v0.2.0)

# v0.2.0 RC: release.yml dry run이 만든 공식 산출물(Windows NSIS, Linux AppImage)을 일회용 runner에서 실제 백엔드로 실행한다.
# 실제 사용자 프로필·자격증명·클러스터·DB 없음: runner 안의 임시 home, 합성 프로젝트, 127.0.0.1 합성 Kubernetes API, 가짜 token.
# required check가 아니다(수동 실행과 이 하네스를 바꾸는 PR에서만). 결과 JSON은 artifact로 남긴다.
# 판정은 fail-closed: 단계 3~14 중 FAIL·오류·빠진 단계·허용 목록 밖 NOT-RUN이 하나라도 있으면 job이 실패한다
# (packaged-rc.mjs 종료 코드 + check-rc-result.mjs 독립 재판정). inject_failure는 이 실패 전파를 실제 runner에서 확인하는 용도다.
on:
  pull_request:
    paths:
      - "scripts/rc/**"
      - ".github/workflows/rc-packaged.yml"
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "release.yml dry-run run ID whose artifacts are verified"
        required: true
      inject_failure:
        description: "Force an RC failure to prove the job fails (none keeps the real result)"
        type: choice
        default: none
        options: [none, step-fail, check-fail, error, missing-step, not-run]

permissions:
  contents: read
  actions: read

env:
  # PR에서 실행할 때 쓰는 dry run(main a951ad6, run 38108687721).
  RELEASE_RUN_ID: ${{ inputs.release_run_id || '38108687721' }}
  OPENHUB_RC_INJECT_FAILURE: ${{ inputs.inject_failure || 'none' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: openhub-release-dry-run
          path: rc-in
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: "1 Packaging and checksums"
        shell: pwsh
        run: |
          $dir = "rc-in/dist"
          $bad = @()
          foreach ($line in Get-Content "$dir/SHA256SUMS") {
            $hash, $name = $line -split "\s+", 2
            $actual = (Get-FileHash (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { $bad += $name }
            "$name $actual"
          }
          if ($bad.Count -gt 0) { throw "checksum mismatch: $bad" }
          $exe = Get-ChildItem "$dir/OpenHub-AI-Setup-*-x64.exe"
          $sig = Get-AuthenticodeSignature $exe.FullName
          "authenticode=$($sig.Status) file=$($exe.Name) size=$($exe.Length)"
          "INSTALLER=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: "2 Install (NSIS silent, per-user folder)"
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "rc-app"
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList "/S", "/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS exit $($p.ExitCode)" }
          $exe = Join-Path $target "OpenHub AI.exe"
          if (-not (Test-Path $exe)) { throw "installed exe missing" }
          "APP_EXE=$exe" >> $env:GITHUB_ENV
          "APP_DIR=$target" >> $env:GITHUB_ENV
      - name: "3-14 Packaged app with real backends"
        run: node scripts/rc/packaged-rc.mjs run --os windows --exe "$env:APP_EXE" --work "$env:RUNNER_TEMP/rc-work" --out rc-out/windows.json
        shell: pwsh
      - name: "15 Uninstall (NSIS) and compare user settings"
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node scripts/rc/packaged-rc.mjs snapshot --work "$env:RUNNER_TEMP/rc-work" --out rc-out/windows-before-uninstall.json
          $un = Join-Path $env:APP_DIR "Uninstall OpenHub AI.exe"
          $p = Start-Process -FilePath $un -ArgumentList "/S", "_?=$env:APP_DIR" -Wait -PassThru
          "uninstaller exit $($p.ExitCode); exe left: $(Test-Path $env:APP_EXE)"
          if (Test-Path $env:APP_EXE) { throw "program files remain after uninstall" }
          node scripts/rc/packaged-rc.mjs snapshot --work "$env:RUNNER_TEMP/rc-work" --out rc-out/windows-after-uninstall.json
          node scripts/rc/packaged-rc.mjs compare rc-out/windows-before-uninstall.json rc-out/windows-after-uninstall.json
      - name: "Verdict (steps 3-14 result file, fail-closed)"
        if: ${{ !cancelled() }}
        run: node scripts/rc/check-rc-result.mjs rc-out/windows.json --os windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-windows
          path: rc-out
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Electron 실행 의존성(xvfb·GTK·NSS)
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 libnotify4 libsecret-1-0
      - uses: actions/download-artifact@v4
        with:
          name: openhub-release-dry-run
          path: rc-in
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: "1 Packaging and checksums"
        run: |
          set -euo pipefail
          cd rc-in/dist
          sha256sum -c SHA256SUMS
          ls -l OpenHub-AI-*-x86_64.AppImage
      - name: "2 Start (chmod +x, extract, AppRun)"
        run: |
          set -euo pipefail
          app="$(ls "$PWD"/rc-in/dist/OpenHub-AI-*-x86_64.AppImage)"
          chmod +x "$app"
          mkdir -p "$RUNNER_TEMP/rc-appimage" && cd "$RUNNER_TEMP/rc-appimage"
          # runner에는 FUSE가 없어 AppImage를 풀어서 AppRun으로 실행한다(release smoke와 같은 방식).
          "$app" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          echo "APPIMAGE=$app" >> "$GITHUB_ENV"
          echo "APP_EXE=$RUNNER_TEMP/rc-appimage/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: "3-14 Packaged app with real backends"
        # --no-sandbox: runner에서 Chromium SUID sandbox를 설정할 수 없다(테스트 환경 전용, 배포물은 그대로).
        run: xvfb-run -a node scripts/rc/packaged-rc.mjs run --os linux --exe "$APP_EXE" --arg --no-sandbox --work "$RUNNER_TEMP/rc-work" --out rc-out/linux.json
      - name: "15 Remove the AppImage and compare user settings"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/rc/packaged-rc.mjs snapshot --work "$RUNNER_TEMP/rc-work" --out rc-out/linux-before-remove.json
          rm -f "$APPIMAGE"
          rm -rf "$RUNNER_TEMP/rc-appimage"
          test ! -e "$APPIMAGE"
          node scripts/rc/packaged-rc.mjs snapshot --work "$RUNNER_TEMP/rc-work" --out rc-out/linux-after-remove.json
          node scripts/rc/packaged-rc.mjs compare rc-out/linux-before-remove.json rc-out/linux-after-remove.json
      - name: "Verdict (steps 3-14 result file, fail-closed)"
        if: ${{ !cancelled() }}
        run: node scripts/rc/check-rc-result.mjs rc-out/linux.json --os linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-linux
          path: rc-out
          if-no-files-found: warn

