# 테스트 전용 fixture(v0.2.1 #39). v0.2.0 Registry의 Serena Manifest(버전 미고정)를 그대로 둔다.
# 실제 registry/에는 없다(Serena는 지원 중단 도구, packages/core/src/registry/withdrawn.ts). uvx --from 식별·Registry 검사·
# 기존 사용자 상태 호환 테스트가 "예전에 설치된 Serena"를 재현할 때만 쓴다.
schemaVersion: 1
name: serena
displayName: Serena
summary: 언어 서버 기반으로 심볼 단위 탐색·편집을 제공하는 코딩 Agent 툴킷(MCP)
repository:
  github: oraios/serena
category: [coding-agent, mcp, context]
capabilities: [semantic-code-navigation, code-editing]
targets: [claude-code, codex, cursor]
platform: { windows: true, macos: true, linux: true }
requirements:
  python: ">=3.11,<3.15"
install:
  preferredAdapter: uvx
  options:
    command: "uvx --from serena-agent serena start-mcp-server"
  fallback:
    - adapter: uv
      package: serena-agent
healthCheck:
  type: mcp-handshake
update:
  source: pypi
rollback:
  supported: true
verification: community
recommendation:
  identity: { mcpServerNames: [serena] }
  source: { type: dedicated }
