schemaVersion: 1
name: chrome-devtools-mcp
displayName: Chrome DevTools MCP
summary: Chrome DevTools로 페이지 조작, 성능 트레이스, 네트워크·콘솔 분석을 하는 MCP 서버
repository:
  github: ChromeDevTools/chrome-devtools-mcp
category: [browser, mcp, testing]
capabilities: [browser-automation, performance-tracing, network-inspection]
targets: [claude-code, codex, cursor, gemini-cli]
platform: { windows: true, macos: true, linux: true }
requirements:
  node: ">=20.19"
install:
  preferredAdapter: npx
  options:
    command: "npx chrome-devtools-mcp@latest"
  fallback:
    - adapter: npm
      package: chrome-devtools-mcp
healthCheck:
  type: mcp-handshake
update:
  source: npm
rollback:
  supported: true
verification: community
# 추천 메타데이터(D-008): canonical MCP alias는 normalized lowercase, Registry 전체에서 유일
recommendation:
  appliesTo: { stacks: [react, nextjs, vue] }
  identity: { mcpServerNames: [chrome-devtools] }
  source: { type: dedicated }
