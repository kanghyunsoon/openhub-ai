schemaVersion: 1
name: kubernetes-mcp-server
displayName: Kubernetes MCP Server
summary: kubeconfig의 현재 context로 리소스·Pod 로그·이벤트를 조회하는 Kubernetes MCP 서버(OpenHub는 --read-only로 설치)
repository:
  github: containers/kubernetes-mcp-server
category: [mcp, automation]
capabilities: [kubernetes-operations]
targets: [claude-code, codex, cursor]
platform: { windows: true, macos: true, linux: true }
env:
  - name: KUBECONFIG
    required: false
    description: 사용할 kubeconfig 경로(없으면 ~/.kube/config). OpenHub는 이 파일을 읽거나 바꾸지 않는다
install:
  preferredAdapter: npx
  options:
    # --read-only: readOnlyHint 도구만 노출한다(pod 삭제·exec, 리소스 생성·수정·삭제·scale 제외). 검증 기록: docs/specs/registry-expansion.md
    command: "npx -y kubernetes-mcp-server --read-only"
healthCheck:
  type: mcp-handshake
update:
  source: npm
rollback:
  supported: true
verification: community
# 추천 메타데이터(D-008): canonical MCP alias는 normalized lowercase, Registry 전체에서 유일
recommendation:
  appliesTo: { stacks: [kubernetes] }
  identity: { mcpServerNames: [kubernetes] }
  source: { type: dedicated }
