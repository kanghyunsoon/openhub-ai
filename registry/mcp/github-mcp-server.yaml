schemaVersion: 1
name: github-mcp-server
displayName: GitHub MCP Server
summary: GitHub 이슈·PR·코드 검색·Actions를 Agent에서 다루는 GitHub 공식 MCP 서버
repository:
  github: github/github-mcp-server
category: [mcp, automation]
capabilities: [github-api, issue-tracking, pull-request-review]
targets: [claude-code, codex, cursor, vscode]
platform: { windows: true, macos: true, linux: true }
requirements:
  docker: true
env:
  - name: GITHUB_PERSONAL_ACCESS_TOKEN
    required: true
    description: 저장소 권한이 있는 GitHub Personal Access Token
install:
  preferredAdapter: docker
  options:
    image: ghcr.io/github/github-mcp-server
healthCheck:
  type: mcp-handshake
update:
  source: docker-tag
rollback:
  supported: true
verification: community
# 추천 메타데이터(D-008): canonical MCP alias는 normalized lowercase, Registry 전체에서 유일
recommendation:
  identity: { mcpServerNames: [github] }
  source: { type: dedicated }
